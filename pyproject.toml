[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "work-scheduler"
version = "0.2.0"
description = "Desktop application for planning employee work schedules"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
authors = [
    { name = "Eliasz Piotr" },
]
dependencies = [
    "PySide6>=6.7,<7",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.14,<2",
]

[project.urls]
Homepage = "https://github.com/eliaszpiotr/Work-Schedule"
Repository = "https://github.com/eliaszpiotr/Work-Schedule"
Issues = "https://github.com/eliaszpiotr/Work-Schedule/issues"
Releases = "https://github.com/eliaszpiotr/Work-Schedule/releases"

[project.optional-dependencies]
dev = [
    # 9.0.3 is the first release without PYSEC-2026-1845: pytest's temporary
    # directories used a predictable name under /tmp, which another account could get
    # in front of.
    "pytest>=9.0.3,<10",
    "ruff>=0.9,<1",
    "pyinstaller>=6.11,<7",
]

[project.scripts]
work-scheduler = "work_scheduler.main:main"

[tool.setuptools.packages.find]
where = ["src"]

# Migrations are not an importable package, so they ship as package data.
[tool.setuptools.package-data]
work_scheduler = [
    "migrations/env.py",
    "migrations/script.py.mako",
    "migrations/versions/*.py",
    "ui/assets/fonts/*.ttf",
    "ui/assets/icons/*.svg",
    "ui/assets/app_icon.png",
    "ui/assets/app_icon.ico",
    "ui/assets/app_icon.icns",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: isolated business logic without database, filesystem, or application windows",
    "integration: tests crossing database, filesystem, migration, service, or PDF boundaries",
    "ui: Qt widgets, rendering, and complete user workflows",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
