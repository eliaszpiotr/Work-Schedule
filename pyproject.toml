[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "work-scheduler"
version = "0.2.0"
description = "Desktop application for planning employee work schedules"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7,<7",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.14,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[project.scripts]
work-scheduler = "work_scheduler.main:main"

[tool.setuptools.packages.find]
where = ["src"]

# Migrations are not an importable package, so they ship as package data.
[tool.setuptools.package-data]
work_scheduler = [
    "migrations/env.py",
    "migrations/script.py.mako",
    "migrations/versions/*.py",
    "ui/assets/fonts/*.ttf",
    "ui/assets/icons/*.svg",
    "ui/assets/app_icon.png",
    "ui/assets/app_icon.ico",
    "ui/assets/app_icon.icns",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
