name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import ast
          import os
          import tomllib
          from pathlib import Path

          project_version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          init_module = ast.parse(Path("src/work_scheduler/__init__.py").read_text())
          package_version = next(
              ast.literal_eval(node.value)
              for node in init_module.body
              if isinstance(node, ast.Assign)
              and any(
                  isinstance(target, ast.Name) and target.id == "__version__"
                  for target in node.targets
              )
          )
          tag = os.environ["RELEASE_TAG"]
          expected_tag = f"v{project_version}"
          if package_version != project_version or tag != expected_tag:
              raise SystemExit(
                  "Release version mismatch: "
                  f"tag={tag!r}, pyproject={project_version!r}, package={package_version!r}"
              )
          print(f"Release versions agree: {tag}")
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -e .
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: work-scheduler-macos-arm64
          - os: macos-15-intel
            artifact: work-scheduler-macos-x86_64
          - os: windows-latest
            artifact: work-scheduler-windows-x86_64
          - os: ubuntu-22.04
            artifact: work-scheduler-linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -e .
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0
      - name: Build
        run: pyinstaller --noconfirm --clean packaging/work-scheduler.spec

      # A disk image is what macOS users expect to download; the other platforms
      # get a plain archive that unpacks next to wherever they keep it.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          hdiutil create -volname "Work Scheduler" \
            -srcfolder "dist/Work Scheduler.app" \
            -ov -format UDZO "${{ matrix.artifact }}.dmg"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path "dist/Work Scheduler/*" -DestinationPath "${{ matrix.artifact }}.zip"
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "${{ matrix.artifact }}.tar.gz" -C dist "Work Scheduler"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            *.dmg
            *.zip
            *.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --title "Work Scheduler ${GITHUB_REF_NAME}" \
            --notes-file packaging/RELEASE_NOTES.md \
            artifacts/*
